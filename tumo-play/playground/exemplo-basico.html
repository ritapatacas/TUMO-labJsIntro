<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O meu primeiro jogo</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #111; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="tumoplay"></div>

  <script src="../lib/tumoplay.js"></script>
  <script>
    // 1. Create the game area (600 x 400 pixels)
    TumoPlay.createGame({ width: 600, height: 400 });

    // 2. Create the player: a blue square
    let player = TumoPlay.createSprite({ x: 284, y: 184, color: "#3b82f6" });

    // 3. How many pixels the player moves each time
    let speed = 3;

    // 4. Arrow keys move the player
    TumoPlay.onKey("ArrowUp", function () {
      player.move(0, -speed);
    });
    TumoPlay.onKey("ArrowDown", function () {
      player.move(0, speed);
    });
    TumoPlay.onKey("ArrowLeft", function () {
      player.move(-speed, 0);
    });
    TumoPlay.onKey("ArrowRight", function () {
      player.move(speed, 0);
    });

    // 5. Start!
    TumoPlay.startGame();
  </script>
</body>
</html>
